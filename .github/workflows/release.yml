name: Release

on:
  push:
    tags: [ "v*.*.*" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Phiên bản (vd: 1.2.0) – tag v<version> sẽ được tạo tại commit đang chọn"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}" }
          $v = $v.TrimStart("v")
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Phiên bản không hợp lệ: $v" }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Publish package
        shell: pwsh
        run: ./scripts/publish.ps1 -Version ${{ steps.ver.outputs.version }} -Package
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: AD User Manager v${{ steps.ver.outputs.version }}
          body_path: CHANGELOG-RELEASE.md
          make_latest: true
          files: |
            publish/ADUserManager-*-win-x64.zip
            publish/ADUserManager-*-win-x64.zip.sha256
